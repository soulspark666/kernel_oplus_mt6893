name: Build Kernel

on:
  push:
    branches:
      - resukisu-susfs-kpm
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Kernel branch to build"
        required: true
        default: "resukisu-susfs-kpm"
      kernel_config:
        description: "Kernel config to build"
        required: false
        default: "mt6893_defconfig"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.kernel_branch || github.ref_name }}
          submodules: recursive

      - name: Patch KSU version base
        run: |
          sed -i 's/30000 + $(KSU_LOCAL_VERSION) + 700/350000 + $(KSU_LOCAL_VERSION) + 700/' KernelSU/kernel/Kbuild

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libncurses5-dev libssl-dev python3 zip

      - name: Set up Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Build Kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          DEFCONFIG: ${{ github.event.inputs.kernel_config || 'mt6893_defconfig' }}
          KBUILD_BUILD_USER: xCaptaiN09
          KBUILD_BUILD_HOST: NetHunter
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/bin:$PATH"
          make O=out ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            "$DEFCONFIG"
          make O=out ARCH=arm64 SUBARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            -j"$(nproc)"
          test -f out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb

      - name: Create AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/liwhy1/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          rm -rf .git
          zip -r9 ../ReSukiSU_OP6893_KPM.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU_OP6893_KPM
          path: ReSukiSU_OP6893_KPM.zip
