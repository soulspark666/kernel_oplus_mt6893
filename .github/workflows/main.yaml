name: Build Kernel

on:
  push:
    branches:
      - pipeline
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache lld

    - name: Build Kernel
      uses: dabao1955/kernel_build_action@main
      env:
        LLVM: 1
        LLVM_IAS: 1
      with:
          kernel-url: https://github.com/soulspark666/kernel_oplus_mt6893
          kernel-branch: lineage-23.2
          ccache: true
          config: mt6893_defconfig
          arch: arm64

          aosp-gcc: false
          aosp-clang: false
          # aosp-clang-version: r547379
          other-clang-url: https://gitlab.com/LeCmnGend/clang.git
          other-clang-branch: clang-17
          other-gcc32-url: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
          other-gcc32-branch: android12L-release
          other-gcc64-url: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

          ksu: false
          ksu-other: false

          disable-lto: true

          anykernel3: true
          anykernel3-url: https://github.com/nishant6342/AnyKernel3

          access-token: ${{ secrets.GITHUB_TOKEN }}
          release: true

          extra-make-args: '[
            "CC=clang",
            "CLANG_TRIPLE=aarch64-linux-gnu-"
          ]'